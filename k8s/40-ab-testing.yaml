---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: ab-test
    track: variant-a
spec:
  selector:
    app: aceest-variant-a
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: ab-test
    track: variant-b
spec:
  selector:
    app: aceest-variant-b
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-main
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: ab-test
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
spec:
  ingressClassName: nginx
  rules:
  - host: ab.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-variant-a
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-variant-b
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: ab-test
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/canary: 'true'
    nginx.ingress.kubernetes.io/canary-by-header: X-Variant
    nginx.ingress.kubernetes.io/canary-by-header-value: B
    nginx.ingress.kubernetes.io/canary-by-cookie: ab_variant
    nginx.ingress.kubernetes.io/canary-weight: '50'
spec:
  ingressClassName: nginx
  rules:
  - host: ab.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-variant-b
            port:
              number: 80
