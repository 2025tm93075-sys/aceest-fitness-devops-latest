# ---------------------------------------------------------------------------
# 1. ROLLING UPDATE
# Pods are replaced one at a time (maxSurge 1, maxUnavailable 0). A new pod
# only receives traffic after /ready passes, so there is no downtime.
# Update   : scripts/rolling-update.sh <tag>
# Rollback : kubectl -n aceest rollout undo deployment/aceest-rolling
# Access   : http://<minikube-ip>:30080  or  http://rolling.aceest.local
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: rolling
    track: rolling
    app: aceest-rolling
  annotations:
    kubernetes.io/change-cause: initial deploy __STABLE_TAG__
spec:
  replicas: 3
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
        app.kubernetes.io/part-of: aceest
        strategy: rolling
        track: rolling
        app: aceest-rolling
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
      - name: web
        image: __IMAGE_REPO__:__STABLE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: DEPLOYMENT_TRACK
          value: rolling
        - name: UI_VARIANT
          value: A
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: secret-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /app/instance
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: rolling
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aceest-rolling
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: rolling
spec:
  selector:
    app: aceest-rolling
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: rolling
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
spec:
  ingressClassName: nginx
  rules:
  - host: rolling.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-rolling
            port:
              number: 80
