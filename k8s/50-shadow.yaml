      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-production
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: shadow
    track: production
spec:
  selector:
    app: aceest-production
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: shadow
    track: shadow
spec:
  selector:
    app: aceest-shadow
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: shadow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/mirror-target: http://aceest-shadow.aceest.svc.cluster.local$request_uri
    nginx.ingress.kubernetes.io/mirror-request-body: 'on'
spec:
  ingressClassName: nginx
  rules:
  - host: shadow.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-production
            port:
              number: 80
