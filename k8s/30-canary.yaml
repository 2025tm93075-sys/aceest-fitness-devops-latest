# ---------------------------------------------------------------------------
# 3. CANARY RELEASE
# The stable version serves most users; the canary gets a weighted share of
# requests through the NGINX ingress canary annotations (default 20%).
# Requests with header "X-Canary: always" always reach the canary (for QA).
# Release  : scripts/canary.sh start <tag> 20 ; scripts/canary.sh weight 50
#            scripts/canary.sh promote          (stable := canary, weight 0)
# Rollback : scripts/canary.sh abort            (weight 0, canary scaled down)
# Access   : http://canary.aceest.local
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
    track: stable
    app: aceest-stable
  annotations:
    kubernetes.io/change-cause: initial deploy __STABLE_TAG__
spec:
  replicas: 3
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
        app.kubernetes.io/part-of: aceest
        strategy: canary
        track: stable
        app: aceest-stable
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
      - name: web
        image: __IMAGE_REPO__:__STABLE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: DEPLOYMENT_TRACK
          value: stable
        - name: UI_VARIANT
          value: A
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: secret-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /app/instance
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
    track: canary
    app: aceest-canary
  annotations:
    kubernetes.io/change-cause: initial deploy __NEW_TAG__
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
        app.kubernetes.io/part-of: aceest
        strategy: canary
        track: canary
        app: aceest-canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
      - name: web
        image: __IMAGE_REPO__:__NEW_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: DEPLOYMENT_TRACK
          value: canary
        - name: UI_VARIANT
          value: A
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: secret-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /app/instance
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
    track: stable
spec:
  selector:
    app: aceest-stable
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
    track: canary
spec:
  selector:
    app: aceest-canary
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-main
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
spec:
  ingressClassName: nginx
  rules:
  - host: canary.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-stable
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-weighted
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: canary
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/canary: 'true'
    nginx.ingress.kubernetes.io/canary-weight: '20'
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary
spec:
  ingressClassName: nginx
  rules:
  - host: canary.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-canary
            port:
              number: 80
