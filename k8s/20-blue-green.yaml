---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: blue-green
spec:
  selector:
    strategy: blue-green
    slot: blue
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30081
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen-preview
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: blue-green
spec:
  selector:
    strategy: blue-green
    slot: green
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30082
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-bluegreen
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: blue-green
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
spec:
  ingressClassName: nginx
  rules:
  - host: bluegreen.aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-bluegreen
            port:
              number: 80
