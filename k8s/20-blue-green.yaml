# ---------------------------------------------------------------------------
# 2. BLUE-GREEN DEPLOYMENT
# Two full environments run side by side. The live Service selects one slot
# (blue or green); the preview Service exposes the idle slot for testing.
# Release  : scripts/blue-green.sh deploy <tag>   (deploys to idle slot + tests)
#            scripts/blue-green.sh switch          (instant cut-over)
# Rollback : scripts/blue-green.sh rollback        (point live back to old slot)
# Access   : live http://<minikube-ip>:30081   preview http://<minikube-ip>:30082
# ---------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app.kubernetes.io/name: aceest-fitness
    app.kubernetes.io/part-of: aceest
    strategy: blue-green
    track: blue
    app: aceest-blue
    slot: blue
  annotations:
    kubernetes.io/change-cause: initial deploy __STABLE_TAG__
spec:
  replicas: 2
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-fitness
        app.kubernetes.io/part-of: aceest
        strategy: blue-green
        track: blue
        app: aceest-blue
        slot: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
      - name: web
        image: __IMAGE_REPO__:__STABLE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: DEPLOYMENT_TRACK
          value: blue
        - name: UI_VARIANT
          value: A
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: secret-key
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aceest-secrets
              key: admin-password
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /app/instance
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
