# Local Jenkins for the BUILD phase:  docker compose -f jenkins/docker-compose.yml up -d
# Then open http://localhost:8080 (initial password: see README).
services:
  jenkins:
    build: .
    container_name: aceest-jenkins
    user: root            # needed to use the host Docker socket in a lab setup
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
