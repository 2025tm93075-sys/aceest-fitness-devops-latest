# SonarQube static analysis for ACEest Fitness & Gym.
# Jenkins passes sonar.host.url and the token (withSonarQubeEnv) plus
# sonar.projectVersion; run locally with:  sonar-scanner -Dsonar.token=<token>
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

sonar.sources=app.py,ACEest_Fitness.py,aceest,templates,static
sonar.tests=tests
sonar.exclusions=legacy/**,k8s/**,jenkins/**,reports/**,dist/**
sonar.python.version=3.12

# Reports produced by the "Build & Unit Tests" stage
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.flake8.reportPaths=reports/flake8.txt
