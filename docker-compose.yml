# Run the application locally:  docker compose up --build
services:
  web:
    build:
      context: .
      target: runtime
    image: aceest-fitness:latest
    ports:
      - "5000:5000"
    environment:
      # Optional: leave unset and the app generates both into the data volume
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - aceest_data:/app/instance
    restart: unless-stopped
volumes:
  aceest_data:
